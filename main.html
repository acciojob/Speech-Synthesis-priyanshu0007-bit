<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href='https://fonts.googleapis.com/css?family=Pacifico' rel='stylesheet' type='text/css'>
  <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="voiceinator">

      <h1>The Voiceinator 5000</h1>

      <select name="voice" id="voices">
        <option value="">Select A Voice</option>
      </select>

      <label for="rate">Rate:</label>
      <input name="rate" type="range" min="0" max="3" value="1" step="0.1">

      <label for="pitch">Pitch:</label>

      <input name="pitch" type="range" min="0" max="2" value="1" step="0.1">
      <textarea name="text">Hello! I love JavaScript 👍</textarea>
      <button id="stop">Stop!</button>
      <button id="speak">Speak</button>

    </div>

```html
<script>
  
const msg = new SpeechSynthesisUtterance();
let voices = [];

const voicesDropdown = document.querySelector('[name="voice"]');
const options = document.querySelectorAll('[type="range"], [name="text"]');
const speakButton = document.querySelector('#speak');
const stopButton = document.querySelector('#stop');

msg.rate = 1;
msg.pitch = 1;

function populateVoices() {
  voices = speechSynthesis.getVoices();

  voicesDropdown.innerHTML = '<option value="">Select A Voice</option>';

  voices.forEach(voice => {
    const option = document.createElement('option');

    option.value = voice.name;
    option.textContent = `${voice.name} (${voice.lang})`;

    voicesDropdown.appendChild(option);
  });
}

function setVoice() {
  const selectedVoice = voices.find(
    voice => voice.name === this.value
  );

  if (selectedVoice) {
    msg.voice = selectedVoice;

    if (speechSynthesis.speaking) {
      speechSynthesis.cancel();

      setTimeout(() => {
        speechSynthesis.speak(msg);
      }, 50);
    }
  }
}

function setOption() {
  if (this.name === 'rate') {
    msg.rate = Number(this.value);
  }

  if (this.name === 'pitch') {
    msg.pitch = Number(this.value);
  }

  if (this.name === 'text') {
    msg.text = this.value;
  }
}

function speak() {
  if (!msg.text || !msg.text.trim()) {
    speechSynthesis.cancel();
    return;
  }

  speechSynthesis.cancel();

  speechSynthesis.speak(msg);
}

function stop() {
  speechSynthesis.cancel();
}

speechSynthesis.addEventListener('voiceschanged', populateVoices);

populateVoices();

voicesDropdown.addEventListener('change', setVoice);

options.forEach(option => {
  option.addEventListener('input', setOption);
});


speakButton.addEventListener('click', speak);
stopButton.addEventListener('click', stop);
</script>
