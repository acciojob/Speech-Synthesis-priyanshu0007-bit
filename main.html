```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="voiceinator">

    <h1>The Voiceinator 5000</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>

    <label for="rate">Rate:</label>
    <input
      name="rate"
      type="range"
      min="0"
      max="3"
      value="1"
      step="0.1"
    >

    <label for="pitch">Pitch:</label>
    <input
      name="pitch"
      type="range"
      min="0"
      max="2"
      value="1"
      step="0.1"
    >

    <textarea name="text">Hello! I love JavaScript 👍</textarea>

    <button id="stop">Stop!</button>
    <button id="speak">Speak</button>

  </div>

  <script>
    const msg = new SpeechSynthesisUtterance();
    let voices = [];

    const voicesDropdown = document.querySelector('[name="voice"]');
    const rate = document.querySelector('[name="rate"]');
    const pitch = document.querySelector('[name="pitch"]');
    const text = document.querySelector('[name="text"]');
    const speakButton = document.querySelector('#speak');
    const stopButton = document.querySelector('#stop');

    // Initial speech settings
    msg.rate = Number(rate.value);
    msg.pitch = Number(pitch.value);
    msg.text = text.value;


    // Populate available voices
    function populateVoices() {
      voices = speechSynthesis.getVoices();

      // Handle case where no voices are available
      if (voices.length === 0) {
        voicesDropdown.innerHTML =
          '<option value="">No voices available</option>';
        return;
      }

      voicesDropdown.innerHTML =
        '<option value="">Select A Voice</option>';

      voices.forEach(function(voice) {
        const option = document.createElement('option');

        option.value = voice.name;
        option.textContent =
          voice.name + ' (' + voice.lang + ')';

        voicesDropdown.appendChild(option);
      });
    }


    // Set selected voice
    function setVoice() {
      const selectedVoice = voices.find(function(voice) {
        return voice.name === voicesDropdown.value;
      });

      if (selectedVoice) {
        msg.voice = selectedVoice;

        // Restart speech if voice is changed during speech
        if (speechSynthesis.speaking) {
          speechSynthesis.cancel();

          setTimeout(function() {
            speechSynthesis.speak(msg);
          }, 50);
        }
      }
    }


    // Update rate
    function setRate() {
      msg.rate = Number(rate.value);
    }


    // Update pitch
    function setPitch() {
      msg.pitch = Number(pitch.value);
    }


    // Update text
    function setText() {
      msg.text = text.value;
    }


    // Speak
    function speak() {
      const enteredText = text.value;

      // Prevent empty input
      if (enteredText === '') {
        return;
      }

      // Prevent whitespace-only input
      if (enteredText.trim() === '') {
        return;
      }

      msg.text = enteredText;
      msg.rate = Number(rate.value);
      msg.pitch = Number(pitch.value);

      const selectedVoice = voices.find(function(voice) {
        return voice.name === voicesDropdown.value;
      });

      if (selectedVoice) {
        msg.voice = selectedVoice;
      }

      speechSynthesis.cancel();
      speechSynthesis.speak(msg);
    }


    // Stop speech
    function stop() {
      speechSynthesis.cancel();
    }


    // Try to populate voices immediately
    populateVoices();


    // Populate voices when browser finishes loading them
    speechSynthesis.addEventListener(
      'voiceschanged',
      populateVoices
    );


    // Event listeners
    voicesDropdown.addEventListener(
      'change',
      setVoice
    );

    rate.addEventListener(
      'input',
      setRate
    );

    pitch.addEventListener(
      'input',
      setPitch
    );

    text.addEventListener(
      'input',
      setText
    );

    speakButton.addEventListener(
      'click',
      speak
    );

    stopButton.addEventListener(
      'click',
      stop
    );

  </script>

</body>
</html>
