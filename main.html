```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Speech Synthesis</title>
  <link href="https://fonts.googleapis.com/css?family=Pacifico" rel="stylesheet" type="text/css">
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="voiceinator">

    <h1>The Voiceinator 5000</h1>

    <select name="voice" id="voices">
      <option value="">Select A Voice</option>
    </select>

    <label for="rate">Rate:</label>
    <input
      name="rate"
      type="range"
      min="0"
      max="3"
      value="1"
      step="0.1"
    >

    <label for="pitch">Pitch:</label>
    <input
      name="pitch"
      type="range"
      min="0"
      max="2"
      value="1"
      step="0.1"
    >

    <textarea name="text">Hello! I love JavaScript 👍</textarea>

    <button id="stop">Stop!</button>
    <button id="speak">Speak</button>

  </div>

  <script>
    const msg = new SpeechSynthesisUtterance();
    let voices = [];

    const voicesDropdown = document.querySelector('[name="voice"]');
    const rate = document.querySelector('[name="rate"]');
    const pitch = document.querySelector('[name="pitch"]');
    const text = document.querySelector('[name="text"]');
    const speakButton = document.querySelector('#speak');
    const stopButton = document.querySelector('#stop');

    msg.rate = Number(rate.value);
    msg.pitch = Number(pitch.value);
    msg.text = text.value;

    function populateVoices() {
      voices = speechSynthesis.getVoices();

      if (voices.length === 0) {
        return;
      }

      voicesDropdown.innerHTML =
        '<option value="">Select A Voice</option>';

      voices.forEach(function(voice) {
        const option = document.createElement('option');

        option.value = voice.name;
        option.textContent = voice.name + ' (' + voice.lang + ')';

        voicesDropdown.appendChild(option);
      });
    }

    function setVoice() {
      const selectedVoice = voices.find(function(voice) {
        return voice.name === voicesDropdown.value;
      });

      if (selectedVoice) {
        msg.voice = selectedVoice;

        if (speechSynthesis.speaking) {
          speechSynthesis.cancel();

          setTimeout(function() {
            speechSynthesis.speak(msg);
          }, 50);
        }
      }
    }

    function setRate() {
      msg.rate = Number(rate.value);
    }

    
    function setPitch() {
      msg.pitch = Number(pitch.value);
    }

    
    function setText() {
      msg.text = text.value;
    }

    
    function speak() {
      const enteredText = text.value.trim();

      if (enteredText === '') {
        return;
      }

      msg.text = enteredText;
      msg.rate = Number(rate.value);
      msg.pitch = Number(pitch.value);

      const selectedVoice = voices.find(function(voice) {
        return voice.name === voicesDropdown.value;
      });

      if (selectedVoice) {
        msg.voice = selectedVoice;
      }

      speechSynthesis.cancel();
      speechSynthesis.speak(msg);
    }

    function stop() {
      speechSynthesis.cancel();
    }

    populateVoices();

    speechSynthesis.addEventListener(
      'voiceschanged',
      populateVoices
    );


    voicesDropdown.addEventListener('change', setVoice);

    rate.addEventListener('input', setRate);

    pitch.addEventListener('input', setPitch);

    text.addEventListener('input', setText);

    speakButton.addEventListener('click', speak);

    stopButton.addEventListener('click', stop);
  </script>

</body>
</html>
```
